<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estúdio Feito de Nós - Mockup 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estúdio">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<style>
  :root {
    --bg:#111417; --panel:#181c21; --line:#262c33; --text:#e6e9ee; --dim:#8b95a3;
    --accent:#5b9dff; --pro:#e0a33a;
    --sidebar-w: 330px;
    --header-h: 56px;
    --fab-size: 56px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overscroll-behavior:none; }
  body {
    background:var(--bg); color:var(--text);
    font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
  }

  /* Header */
  header {
    display:flex; align-items:center; gap:12px;
    padding:0 12px; height:var(--header-h);
    background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:50; flex-wrap:wrap;
  }
  header h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:.2px; flex:1; }
  header h1 span { color:var(--dim); font-weight:400; }
  .header-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  select, button, input[type=number] {
    background:#0e1114; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font:inherit;
  }
  button { cursor:pointer; }
  button:hover { border-color:#3a444f; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#07101c; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  label { color:var(--dim); font-size:12px; }

  /* Main layout */
  main { flex:1; display:flex; min-height:0; position:relative; }

  /* Viewport / Canvas */
  #viewport { flex:1; position:relative; min-width:0; background:#0a0c0e; }
  #scene { width:100%; height:100%; display:block; touch-action:none; outline:none; }

  /* Desktop Sidebar */
  aside {
    width:var(--sidebar-w);
    max-width:100%;
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:20px;
    transition:transform .3s ease, visibility .3s, opacity .3s;
  }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:0 0 8px; font-weight:600; }
  aside section { margin-bottom:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .meta { color:var(--dim); font-size:11px; }
  .meta b { color:var(--text); font-weight:600; }
  code { background:#0e1114; padding:1px 5px; border-radius:3px; font-size:11px; }

  #log { position:absolute; inset:0; display:none; place-items:center; background:rgba(8,10,12,.9); font-size:13px; color:var(--dim); }

  #tplList { max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; }
  #tplList .tpl { padding:5px 9px; cursor:pointer; border-bottom:1px solid #1c2228; display:flex; justify-content:space-between; }
  #tplList .tpl:hover { background:#1d232a; }
  #tplList .tpl.on { background:var(--accent); color:#07101c; }
  #tplList .tpl .tag { color:var(--pro); font-size:10px; }
  #tplList .tpl.on .tag { color:#07101c; }

  #designWrap { background:#fff; border-radius:6px; padding:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; height:110px; }
  #designWrap .canvas-container { max-width:100% !important; height:auto !important; }
  #designWrap canvas { max-width:100% !important; height:auto !important; }

  /* Overlay / Fullscreen editor */
  .overlay { position:fixed; inset:0; z-index:60; background:rgba(6,8,10,.93); display:none; }
  .overlay.on { display:flex; }
  .ed-panel { margin:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; max-width:min(1400px,96vw); max-height:96vh; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .ed-head { display:flex; justify-content:space-between; align-items:center; gap:20px; }
  .ed-head b { font-size:14px; }
  .ed-body { background:#fff; border-radius:8px; padding:14px; overflow:auto; display:flex; align-items:center; justify-content:center; min-height:120px; }
  .ed-body .canvas-container { max-width:100%; }
  .ed-foot { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .ed-foot input[type=range] { width:170px; }
  .hint { color:var(--dim); font-size:11px; }

  /* ===== MOBILE: Bottom Sheet Sidebar ===== */
  @media (max-width: 768px) {
    header { padding:0 8px; }
    header h1 { font-size:13px; }
    .header-controls { gap:6px; }
    select, button, input[type=number] { padding:5px 8px; font-size:12px; }
    #expW { width:70px; }

    /* Sidebar becomes bottom sheet */
    aside {
      position:fixed; left:0; right:0; bottom:0;
      width:100%; max-width:none; height:auto; max-height:85vh;
      border-left:none; border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;
      transform:translateY(100%);
      visibility:hidden; opacity:0;
      z-index:40;
      padding:12px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0));
      box-shadow:0 -4px 24px rgba(0,0,0,.4);
    }
    aside.open {
      transform:translateY(0);
      visibility:visible; opacity:1;
    }

    /* Drag handle */
    aside::before {
      content:""; display:block; width:36px; height:4px;
      background:var(--line); border-radius:2px;
      margin:0 auto 12px; touch-action:none;
    }

    /* Hide sidebar scroll on body when open */
    body.sidebar-open { overflow:hidden; }

    /* FAB to open sidebar */
    .fab {
      position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0));
      width:var(--fab-size); height:var(--fab-size);
      border-radius:50%; background:var(--accent); color:#07101c;
      border:none; font-size:22px; display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 16px rgba(0,0,0,.3); z-index:30;
      transition:transform .2s, background .2s;
    }
    .fab:active { transform:scale(.95); background:#4a8eef; }
    .fab.hidden { transform:scale(0); pointer-events:none; }
  }

  /* Desktop: hide FAB */
  @media (min-width: 769px) {
    .fab { display:none; }
  }

  /* Small mobile adjustments */
  @media (max-width: 480px) {
    header h1 span { display:none; }
    .header-controls label { display:none; }
    #sceneSel, #expMode { min-width:120px; }
  }
</style>
</head>
<body>
<header>
  <h1>Estúdio Feito de Nós <span>Mockup 3D</span></h1>
  <div class="header-controls">
    <label>Cena</label>
    <select id="sceneSel"></select>
    <label>Formato</label>
    <select id="expMode">
      <option value="scene">Cena 3D</option>
      <option value="studio">Folha de estudo</option>
    </select>
    <label>Exportar</label>
    <input id="expW" type="number" value="2000" min="100" max="8000" step="100" style="width:88px">
    <button class="primary" id="exportBtn">Exportar PNG</button>
  </div>
</header>

<main>
  <div id="viewport">
    <canvas id="scene"></canvas>
    <div id="log">carregando...</div>
  </div>
  <aside id="sidebar">
    <section>
      <h2>Produto</h2>
      <input id="tplSearch" placeholder="filtrar templates..." style="width:100%;margin-bottom:8px">
      <div id="tplList"></div>
    </section>

    <section>
      <h2>Design</h2>
      <div id="printTabs"></div>
      <div class="row" style="margin-top:10px">
        <input type="file" id="file" accept="image/*">
        <button id="fitBtn">Ajustar</button>
        <button id="clearBtn">Limpar</button>
      </div>
      <div id="designWrap"></div>
      <div class="meta" id="designMeta" style="margin-top:8px"></div>
      <div class="row" id="rotRow" style="margin-top:10px">
        <label>Rotação</label>
        <input type="range" id="rot" min="0" max="1" step="0.005" value="0.1465" style="flex:1">
        <span class="meta" id="rotVal">0.147</span>
      </div>
      <button id="editBtn" class="primary" style="width:100%;margin-top:10px">Abrir editor de design (tela cheia)</button>
    </section>

    <section>
      <h2>Cores do produto</h2>
      <div id="colorRows"></div>
    </section>

    <section>
      <h2>Marca d'agua</h2>
      <div class="row">
        <select id="wmSel" style="flex:1"></select>
        <label style="display:flex;align-items:center;gap:5px">
          <input type="checkbox" id="wmOn" checked> mostrar
        </label>
      </div>
      <div class="row">
        <input type="file" id="wmFile" accept="image/*">
      </div>
      <div class="row">
        <label>Tamanho</label>
        <input type="range" id="wmSize" min="0.03" max="0.40" step="0.005" value="0.13" style="flex:1">
        <span class="meta" id="wmSizeVal">13%</span>
      </div>
      <div class="meta">Fica no canto superior esquerdo, como no Rapid Mockup.</div>
    </section>

    <section>
      <h2>Informações</h2>
      <div class="meta" id="info"></div>
    </section>
  </aside>
</main>

<!-- FAB para abrir sidebar no mobile -->
<button class="fab" id="fabSidebar" aria-label="Abrir painel" title="Painel de controle">🎛️</button>

<!-- Overlay de fundo quando sidebar aberta no mobile -->
<div id="sidebarBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35; opacity:0; transition:opacity .3s;"></div>

<div id="editor" class="overlay">
  <div class="ed-panel">
    <div class="ed-head">
      <span><b>Editor de design</b> &mdash; área <span id="edName"></span> <span class="hint">(arraste para mover, arraste os cantos para redimensionar, roda do mouse para zoom)</span></span>
      <button id="edClose">Fechar (Esc)</button>
    </div>
    <div class="ed-body"><div id="edCanvas"></div></div>
    <div class="ed-foot">
      <input type="file" id="edFile" accept="image/*">
      <button id="edFit">Ajustar</button>
      <button id="edClear">Limpar</button>
      <label>Zoom</label>
      <input type="range" id="edZoom" min="0.1" max="8" step="0.05" value="1">
      <span class="meta" id="edZoomVal">1.00x</span>
      <label>Rotação no produto</label>
      <input type="range" id="edRot" min="0" max="1" step="0.005" value="0.1465">
      <span class="meta" id="edRotVal">0.147</span>
    </div>
  </div>
</div>

<script src="vendor/babylon.min.js?v=1"></script>
<script src="vendor/babylon.gui.min.js?v=1"></script>
<script src="vendor/babylonjs.materials.min.js?v=1"></script>
<script src="vendor/babylonjs.loaders.min.js?v=1"></script>
<script src="vendor/fabric.min.js?v=1"></script>
<script src="renderer.js?v=35"></script>
<script src="ui.js?v=34"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

// Mobile sidebar toggle
const sidebar = document.getElementById('sidebar');
const fab = document.getElementById('fabSidebar');
const backdrop = document.getElementById('sidebarBackdrop');
let sidebarOpen = false;

function openSidebar() {
  sidebar.classList.add('open');
  backdrop.style.display = 'block';
  requestAnimationFrame(() => backdrop.style.opacity = '1');
  document.body.classList.add('sidebar-open');
  fab.classList.add('hidden');
  sidebarOpen = true;
}
function closeSidebar() {
  sidebar.classList.remove('open');
  backdrop.style.opacity = '0';
  setTimeout(() => backdrop.style.display = 'none', 300);
  document.body.classList.remove('sidebar-open');
  fab.classList.remove('hidden');
  sidebarOpen = false;
}
function toggleSidebar() { sidebarOpen ? closeSidebar() : openSidebar(); }

fab.addEventListener('click', toggleSidebar);
backdrop.addEventListener('click', closeSidebar);

// Close sidebar on template selection (mobile)
document.addEventListener('click', (e) => {
  if (window.innerWidth <= 768 && sidebarOpen && e.target.closest('.tpl')) {
    closeSidebar();
  }
});

// Drag to close sidebar (mobile)
let dragStartY = 0;
sidebar.addEventListener('touchstart', (e) => { dragStartY = e.touches[0].clientY; }, {passive:true});
sidebar.addEventListener('touchmove', (e) => {
  if (!sidebarOpen) return;
  const dy = e.touches[0].clientY - dragStartY;
  if (dy > 50) { closeSidebar(); }
}, {passive:true});

// Keyboard: Esc closes sidebar/editor
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (sidebarOpen) closeSidebar();
    const editor = document.getElementById('editor');
    if (editor.classList.contains('on')) editor.classList.remove('on');
  }
});
</script>
</body>
</html>
